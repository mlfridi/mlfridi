<title>Herbier d'idées</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: herbarium cabinet. Left rail = taxonomy (categories, types, topics); main = capture strip + specimen sheets grouped by category; right drawer = one sheet in full. */
:root {
  --bg: #F1F4F1; --surface: #FFFFFF; --sunk: #E7ECE8; --ink: #17211B; --muted: #5B6A61; --line: #D5DDD7;
  --accent: #1E5A44; --accent-ink: #FFFFFF; --accent-soft: #DCEBE3; --mark: #A86A0C; --danger: #A3352B;
  --chip-l: 90%; --chip-ink: #1d2a22; --shadow: 0 1px 2px rgb(23 33 27 / .06), 0 6px 18px rgb(23 33 27 / .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1411; --surface: #171E1A; --sunk: #121915; --ink: #E4EBE6; --muted: #91A198; --line: #29342D;
  --accent: #74C6A0; --accent-ink: #0C1510; --accent-soft: #1E3329; --mark: #E3AA4E; --danger: #F08A7E;
  --chip-l: 24%; --chip-ink: #E4EBE6; --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1411; --surface: #171E1A; --sunk: #121915; --ink: #E4EBE6; --muted: #91A198; --line: #29342D;
  --accent: #74C6A0; --accent-ink: #0C1510; --accent-soft: #1E3329; --mark: #E3AA4E; --danger: #F08A7E;
  --chip-l: 24%; --chip-ink: #E4EBE6; --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15 }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }

.app { max-width: 1400px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 28px }
@media (max-width: 860px) { .app { grid-template-columns: minmax(0, 1fr); gap: 18px } }

/* Rail */
.rail { display: flex; flex-direction: column; gap: 22px; min-width: 0 }
.brand h1 { font-size: 26px; font-weight: 700; letter-spacing: -.01em }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px }
.rail h3 { font: 600 11px/1 var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px }
.taxa { display: flex; flex-direction: column; gap: 2px }
.taxon { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; background: none; border-radius: 6px; text-align: left; font-size: 14px }
.taxon:hover { background: var(--sunk) }
.taxon[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600 }
.taxon .dot { width: 9px; height: 9px; border-radius: 50%; background: hsl(var(--h, 150) 45% 45%); flex: none }
.taxon .n { margin-left: auto; color: var(--muted); font: 12px var(--f-mono) }
.taxon .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.cloud { display: flex; flex-wrap: wrap; gap: 6px }
@media (max-width: 860px) {
  .taxa { flex-direction: row; flex-wrap: wrap; gap: 6px }
  .taxon { width: auto; border: 1px solid var(--line) }
  .rail-topics { display: none }
}
.rail-note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px }
.rail-note b { color: var(--ink) }

/* Chips & pills */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap }
button.chip:hover { border-color: var(--accent); color: var(--ink) }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.cat { background: hsl(var(--h, 150) 40% var(--chip-l)); color: var(--chip-ink); border-color: transparent; font-weight: 500 }
.type { font: 600 10.5px/1 var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }

/* Main */
main { display: flex; flex-direction: column; gap: 20px; min-width: 0 }
.capture { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow) }
.capture.drag { border-color: var(--accent); background: var(--accent-soft) }
.capture textarea { width: 100%; min-height: 84px; resize: vertical; border: 0; background: transparent; outline: none; font-size: 15px }
.capture textarea::placeholder { color: var(--muted) }
.cap-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.cap-row input[type=url] { flex: 1 1 220px; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg) }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; font-size: 14px }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.primary:hover { filter: brightness(1.08) }
.btn.danger { color: var(--danger) }
.btn[disabled] { opacity: .5; cursor: not-allowed }
.btn.sm { padding: 4px 10px; font-size: 13px }
.attach { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted) }
.attach img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px }
.hint { font-size: 12px; color: var(--muted); margin-left: auto }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.tabs { display: flex; gap: 2px; background: var(--sunk); border-radius: 9px; padding: 3px }
.tab { border: 0; background: none; padding: 6px 12px; border-radius: 7px; font-weight: 500; font-size: 14px; color: var(--muted) }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow) }
.search { flex: 1 1 200px; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface) }
.banner { font-size: 13px; padding: 8px 12px; border-radius: 8px; background: var(--sunk); color: var(--muted) }
.banner b { color: var(--ink) }

/* Sheets */
.group { display: flex; flex-direction: column; gap: 10px }
.group-head { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px }
.group-head h2 { font-size: 19px; font-weight: 600 }
.group-head .n { font: 12px var(--f-mono); color: var(--muted) }
.group-head .dot { width: 10px; height: 10px; border-radius: 50%; background: hsl(var(--h) 45% 45%); align-self: center }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px }
.sheet { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 7px; min-width: 0; position: relative }
.sheet:hover { border-color: var(--accent) }
.sheet .top { display: flex; align-items: center; gap: 8px }
.sheet .num { font: 600 11px var(--f-mono); color: var(--mark) }
.sheet h4 { margin: 0; font: 600 15.5px/1.3 var(--f-body); overflow-wrap: anywhere }
.sheet p { margin: 0; font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere }
.sheet .thumb { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; background: var(--sunk) }
.sheet .tags { display: flex; flex-wrap: wrap; gap: 4px }
.state { margin-left: auto; font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--mark); animation: pulse 1.1s ease-in-out infinite }
@keyframes pulse { 50% { opacity: .25 } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none } }

.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 28px 22px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start }
.empty h2 { font-size: 20px }
.empty p { margin: 0; color: var(--muted); max-width: 60ch }

/* Synthesis studio */
.studio { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px }
.studio .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 180px }
.field label { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.field select, .field input, .field textarea { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0; width: 100% }
.modes { display: flex; flex-wrap: wrap; gap: 6px }
.out { border-top: 1px solid var(--line); padding-top: 12px; min-height: 40px }
.prose { max-width: 72ch; font-size: 15px; overflow-wrap: anywhere }
.prose h1, .prose h2, .prose h3 { margin: 1.1em 0 .4em; font-size: 18px }
.prose h1:first-child, .prose h2:first-child, .prose h3:first-child { margin-top: 0 }
.prose ul, .prose ol { padding-left: 1.3em; margin: .4em 0 }
.prose p { margin: .5em 0 }
.prose li { margin: .2em 0 }
.muted { color: var(--muted) }
.synth-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px }
.synth-card header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.synth-card details summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 500 }
.plan { display: flex; flex-direction: column; gap: 6px; font-size: 14px }
.plan .mv { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .32); z-index: 20 }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 21; overflow-y: auto; border-left: 1px solid var(--line);
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 20px; display: flex; flex-direction: column; gap: 14px }
.drawer h2 { font-size: 22px; overflow-wrap: anywhere }
.drawer .field { flex: none }
.drawer img.full { width: 100%; border-radius: 8px }
.drawer .body { white-space: pre-wrap; font-size: 14.5px; overflow-wrap: anywhere; background: var(--bg); border-radius: 8px; padding: 12px; max-height: 40vh; overflow-y: auto }
.drawer .meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.drawer a { color: var(--accent); overflow-wrap: anywhere }
.close { margin-left: auto }
.tabs { flex-wrap: wrap }
.stage { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--ink); padding: 2px 8px; border-radius: 999px; background: hsl(var(--h) 45% var(--chip-l)); white-space: nowrap }
.stage::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: hsl(var(--h) 55% 42%) }
.seg { display: flex; flex-wrap: wrap; gap: 6px }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start }
@media (max-width: 1100px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (max-width: 560px) { .board { grid-template-columns: minmax(0, 1fr) } }
.col { background: var(--sunk); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.col-head { display: flex; align-items: baseline; gap: 8px }
.col-head h3 { font-size: 16px }
.col-head .d { font-size: 12px; color: var(--muted) }
.col-head .n { margin-left: auto; font: 12px var(--f-mono); color: var(--muted) }
.mini { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.mini .t { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; font-size: 14px; overflow-wrap: anywhere }
.mini .t:hover { color: var(--accent) }
.mini .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap }
.mini .mv { margin-left: auto; display: flex; gap: 4px }
.mv button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 1px 8px; font-size: 13px }
.mv button:hover { border-color: var(--accent) }
.daily { background: var(--accent-soft); border: 1px solid transparent; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px }
.daily .eyebrow { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--accent) }
.daily h3 { font-size: 18px; overflow-wrap: anywhere }
.daily p { margin: 0; color: var(--muted); max-width: 70ch; overflow-wrap: anywhere }
.chat { display: flex; flex-direction: column; gap: 12px }
.msg { max-width: 760px; border-radius: 12px; padding: 10px 14px; min-width: 0; overflow-wrap: anywhere }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); white-space: pre-wrap }
.msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line) }
.ref { border: 0; background: var(--accent-soft); color: var(--ink); border-radius: 5px; padding: 0 5px; font: 600 12.5px var(--f-mono); cursor: pointer }
.ref:hover { background: var(--accent); color: var(--accent-ink) }
.ask-box { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px }
.ask-box textarea { width: 100%; border: 0; background: transparent; resize: vertical; min-height: 52px; outline: none }
.imp-list { max-height: 360px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--bg) }
.imp-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13.5px; align-items: start }
.imp-row:last-child { border-bottom: 0 }
.imp-row .t { font-weight: 600; overflow-wrap: anywhere }
.imp-row .s { color: var(--muted); font-size: 12px; overflow-wrap: anywhere }
.imp-row.dup { opacity: .55 }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px) }
</style>

<div class="app">
  <aside class="rail" id="rail"></aside>
  <main>
    <section class="capture" id="capture" aria-label="Ajouter un élément">
      <textarea id="capText" placeholder="Collez une note, une idée, une citation, le texte d'un article, un lien… ou déposez / collez une image ici."></textarea>
      <div class="cap-row">
        <input type="url" id="capUrl" placeholder="Source (lien), facultatif">
        <input type="file" id="capFile" accept="image/*,.txt,.md,.markdown,.csv,.json,.xml,.rss,.atom,text/plain" multiple hidden>
        <input type="file" id="capGallery" accept="image/*" multiple hidden>
        <input type="file" id="capCamera" accept="image/*" capture="environment" hidden>
      </div>
      <div class="cap-row">
        <button class="btn" id="capGal" type="button">Galerie photos</button>
        <button class="btn" id="capCam" type="button">Appareil photo</button>
        <button class="btn" id="capPick" type="button">Fichiers</button>
        <button class="btn" id="capBulk" type="button">Import en lot</button>
        <button class="btn" id="capConn" type="button">Drive, Gmail, Notion</button>
        <button class="btn primary" id="capAdd" type="button">Ajouter à l'herbier</button>
      </div>
      <div class="cap-row">
        <span class="attach" id="capAttach" hidden></span>
        <span class="hint">Ctrl + Entrée pour ajouter · l'analyse se lance toute seule</span>
      </div>
    </section>
    <section class="studio" id="connPanel" hidden aria-label="Importer depuis vos services"></section>
    <section class="studio" id="importPanel" hidden aria-label="Import en lot"></section>

    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabSheets" aria-selected="true">Fiches</button>
        <button class="tab" role="tab" id="tabCycle" aria-selected="false">Cycle des idées</button>
        <button class="tab" role="tab" id="tabAsk" aria-selected="false">Demander</button>
        <button class="tab" role="tab" id="tabStudio" aria-selected="false">Synthèses &amp; suggestions</button>
      </div>
      <input class="search" id="search" type="search" placeholder="Rechercher dans le titre, le texte, les sujets…">
      <button class="btn sm primary" id="runQueue" type="button" hidden></button>
      <button class="btn sm" id="reorg" type="button">Réorganiser les catégories</button>
      <button class="btn sm" id="exportAll" type="button">Exporter (.md)</button>
    </div>
    <div id="banner" class="banner" hidden></div>
    <div id="view"></div>
  </main>
</div>
<div id="drawerRoot"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
const TYPES = ["note", "idée", "article", "citation", "tâche", "image", "référence", "question"];
const MODES = {
  synthese: { label: "Synthèse", ask: "Rédige une synthèse structurée : les grands thèmes, les idées clés de chaque thème, les points de convergence et de tension. Cite les fiches par leur numéro (N°…)." },
  suggestions: { label: "Suggestions & pistes", ask: "Propose des suggestions : idées nouvelles qui découlent de ces éléments, sujets à creuser, questions ouvertes, lacunes dans la collecte et sources ou types de contenus à ajouter. Sois concret et cite les fiches (N°…) qui fondent chaque suggestion." },
  actions: { label: "Plan d'action", ask: "Transforme ces éléments en plan d'action : tâches concrètes classées par priorité (haute / moyenne / basse), avec pour chacune la fiche d'origine (N°…) et une première étape réalisable." },
  liens: { label: "Connexions", ask: "Identifie les liens non évidents entre les fiches : rapprochements, doublons, contradictions, idées qui se complètent. Pour chaque connexion, cite les fiches (N°…) et explique en une phrase ce qu'elle apporte." },
  brief: { label: "Brief d'une page", ask: "Rédige un brief d'une page, prêt à partager : contexte, 5 points essentiels, 3 recommandations. Cite les fiches (N°…)." }
};
const EXAMPLES = [
  { text: "Idée : un bot Telegram qui m'envoie chaque matin les 5 articles les plus importants de mes flux RSS, avec un résumé de 2 lignes chacun.", type: "idée" },
  { text: "« La meilleure façon de prédire l'avenir, c'est de le créer. » Peter Drucker", type: "citation" },
  { text: "Le Maroc accélère sur l'hydrogène vert : plusieurs projets annoncés dans la région de Guelmim-Oued Noun, avec des investissements étrangers importants et un objectif d'export vers l'Europe. Les enjeux : eau, foncier, raccordement au réseau.", url: "https://example.org/article-hydrogene-vert", type: "article" },
  { text: "- [ ] Comparer PostgreSQL full-text et un index vectoriel pour la recherche dans les notes\n- [ ] Tester l'OCR sur des captures d'écran", type: "tâche" },
  { text: "Question : comment mesurer la fiabilité d'une source d'information au fil du temps ? Taux de correction, délai de publication, recoupements…", type: "question" }
];

const STAGES = [
  { k: "graine", label: "Graine", d: "idée brute", h: 95 },
  { k: "pousse", label: "Pousse", d: "en réflexion", h: 150 },
  { k: "fleur", label: "Fleur", d: "réalisée", h: 320 },
  { k: "fanee", label: "Fanée", d: "abandonnée", h: 30 }
];
const stageOf = (it) => STAGES.find((s) => s.k === it.stage) || STAGES[0];
const stageChip = (it) => { const s = stageOf(it); return `<span class="stage" style="--h:${s.h}" title="${esc(s.d)}">${s.label}</span>`; };
const S = { items: [], synths: [], ask: { turns: [], running: false, ctl: null, live: "", draft: "", note: "" }, canTools: false, dayOffset: 0, filter: { cat: null, type: null, topic: null, src: null, q: "" }, tab: "sheets",
  imp: null, batch: { running: false, stop: false, note: "" }, mcp: null, conn: null,
  col: null, local: false, sample: null, canImg: false, downloads: null, open: null, pendingFile: null,
  studio: { scope: "all", mode: "synthese", extra: "", running: false, text: "", ctl: null, scopeLabel: "" },
  plan: null, planRunning: false, loaded: false, loadNote: "" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const clip = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n) + "…" : s; };
const fmtDate = (t) => { try { return new Date(t).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }); } catch { return ""; } };

function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600); }
function sampleErr(e) {
  const c = e && e.code;

const STOP = new Set("le la les un une des de du d l et ou en au aux à a pour par sur dans avec sans ce cet cette ces qui que quoi dont où est sont être été il elle ils elles on nous vous je tu me te se mon ma mes ton ta tes son sa ses leur leurs plus moins très pas ne n y the of and to in is for on with that this it as are be by from at an or ses comme mais donc car si tout tous toute toutes fait faire chaque deux entre aussi même comment quand alors avoir peut vers chez selon idée question".split(" "));
function guessType(text, url, hasImg) {
  const t = (text || "").trim();
  if (hasImg && t.length < 40) return "image";
  if (/^\s*[-*]\s*\[[ x]\]/im.test(t) || /^(todo|à faire|tâche)\b/i.test(t)) return "tâche";
  if (/^[«"“]/.test(t)) return "citation";
  if (/^(question|\?)/i.test(t) || /\?\s*$/.test(t.split("\n")[0])) return "question";
  if (/^id[ée]e\b/i.test(t)) return "idée";
  if (url || /^https?:\/\/\S+$/i.test(t)) return t.length > 400 ? "article" : "référence";
  if (t.length > 700) return "article";
  return t.length < 160 ? "idée" : "note";
}
function heuristic(item) {
  const words = ((item.title || "") + " " + (item.text || "")).toLowerCase().normalize("NFC").match(/[\p{L}][\p{L}\p{N}'-]{3,}/gu) || [];
  const freq = {}; for (const w of words) if (!STOP.has(w)) freq[w] = (freq[w] || 0) + 1;
  const top = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([w]) => w);
  return { topics: top.slice(0, 3), keywords: top, category: item.category || "Non classé", summary: item.summary || clip((item.text || "").replace(/\s+/g, " "), 180) };
}

/* ---------- Images ---------- */
function readAsDataURL(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); }); }
async function thumb(file) {
  const url = await readAsDataURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  for (const [max, q] of [[900, .72], [700, .62], [520, .55], [380, .5]]) {
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const d = c.toDataURL("image/jpeg", q); if (d.length < 180000) return d;
  }
  return null;
}

function htmlToText(s) {

  return (d.body.textContent || "").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}
function parseFeed(xml, fallbackName) {

  const chan = doc.querySelector("channel") || doc.documentElement;
  const feedName = (kid(chan, ["title"])?.textContent || fallbackName || "Flux").trim();
  return [...doc.querySelectorAll("item, entry")].map((it) => {
    const linkEl = [...it.children].find((x) => x.localName === "link" && (!x.getAttribute("rel") || x.getAttribute("rel") === "alternate"));
    const url = (linkEl && (linkEl.getAttribute("href") || linkEl.textContent) || kid(it, ["guid", "id"])?.textContent || "").trim();
    const body = kid(it, ["encoded", "content", "description", "summary"])?.textContent || "";
    return { title: htmlToText(kid(it, ["title"])?.textContent || "").slice(0, 200), text: htmlToText(body).slice(0, 20000), url: /^https?:/i.test(url) ? url : "",
      source: feedName, published: (kid(it, ["pubDate", "published", "updated", "date"])?.textContent || "").trim(), type: "article" };
  }).filter((e) => e.title || e.text);
}
async function parseFile(f) {

  if (f.size > 15e6) throw new Error("size");

  if (/\.json$/i.test(f.name) || /^\s*[\[{]/.test(txt) && /json/.test(f.type)) {
    const j = JSON.parse(txt); const arr = Array.isArray(j) ? j : Array.isArray(j.items) ? j.items : [];
    return arr.filter((x) => x && typeof x === "object").map((x) => ({ title: String(x.title || "").slice(0, 200), text: String(x.text || x.content || x.summary || ""), url: String(x.url || x.link || ""),
      source: String(x.source || x.feed || ""), published: String(x.published || x.date || ""), lang: String(x.lang || ""), type: TYPES.includes(x.type) ? x.type : (x.url || x.link ? "article" : "") }))
      .filter((e) => e.title || e.text);

async function imageBlobFor(item, file) {

function md(src) {
  const lines = esc(src).split("\n"); let html = ""; let list = null;
  const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<em>$2</em>").replace(/`([^`]+)`/g, '<code class="mono">$1</code>');
  const close = () => { if (list) { html += "</" + list + ">"; list = null; } };
  for (const raw of lines) {
    const l = raw.trimEnd(); let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { close(); html += `<h3>${inline(m[2])}</h3>`; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
    else if (!l.trim()) close();

  }

}

  if (S.open === id) renderDrawer();
}
function dailyPick() {
  const pool = S.items.filter((i) => ["graine", "pousse"].includes(stageOf(i).k) && !i.example).sort((a, b) => (a.id < b.id ? -1 : 1));
  const list = pool.length ? pool : S.items.filter((i) => ["graine", "pousse"].includes(stageOf(i).k));
  if (!list.length) return null;
  const day = new Date().toISOString().slice(0, 10);
  return list[(hue(day + "herbier") * 7 + S.dayOffset) % list.length];
}

const ASK_SUGGEST = ["Qu'ai-je collecté de plus important ce mois-ci ?", "Quelles idées n'ai-je jamais fait avancer ?", "Quels sujets reviennent le plus souvent ?", "Que me manque-t-il pour passer à l'action sur mes idées en cours ?"];
function numMap() { const m = new Map(); [...S.items].reverse().forEach((it, i) => m.set(i + 1, it)); return m; }
function linkRefs(html) {

  return html.replace(/N°\s?0*(\d{1,5})/g, (all, n) => { const it = m.get(+n); return it ? `<button class="ref" type="button" data-ref="${it.id}" title="${esc(it.title)}">N°${String(n).padStart(3, "0")}</button>` : all; });
}
function ficheBrief(it) { return { num: "N°" + numOf(it), titre: it.title, type: it.type, categorie: it.category || "Non classé", stade: stageOf(it).label, sujets: it.topics || [], date: fmtDate(it.createdAt), resume: clip(it.summary || it.text, 220) }; }
function askTools() {
  return [
    { name: "search_fiches", description: "Recherche plein texte dans toutes les fiches (titre, texte, résumé, texte lu dans les images, sujets, source). Renvoie jusqu'à 15 fiches résumées avec leur numéro.",
      inputSchema: { type: "object", properties: { query: { type: "string", description: "mots à chercher" }, stade: { type: "string", enum: STAGES.map((s) => s.k) } }, required: ["query"] },
      execute: (inp) => {
        const words = String(inp.query || "").toLowerCase().split(/\s+/).filter((w) => w.length > 1);
        const scored = S.items.filter((it) => !inp.stade || stageOf(it).k === inp.stade).map((it) => {
          const hay = [it.title, it.text, it.summary, it.extracted, it.category, it.source, ...(it.topics || []), ...(it.keywords || [])].join(" ").toLowerCase();
          return [words.reduce((n, w) => n + (hay.includes(w) ? 1 : 0), 0), it];
        }).filter(([n]) => n > 0).sort((a, b) => b[0] - a[0]).slice(0, 15);
        return scored.length ? scored.map(([, it]) => ficheBrief(it)) : "Aucune fiche ne contient ces mots.";
      } },
    { name: "get_fiche", description: "Lit une fiche en entier à partir de son numéro (ex. 12 ou \"N°012\"). Renvoie titre, stade, source, résumé, texte complet, texte lu dans l'image et suggestions.",
      inputSchema: { type: "object", properties: { num: { type: "string" } }, required: ["num"] },
      execute: (inp) => {

      } }

}

  const nq = S.items.filter(isWaiting).length; const rq = $("runQueue");
  rq.hidden = !S.sample || (!nq && !S.batch.running);
  rq.textContent = S.batch.running ? "Arrêter l'analyse" : "Analyser " + nq + " fiche(s) en attente";
  const b = $("banner");
  if (S.batch.note) { b.hidden = false; b.textContent = S.batch.note; }
  else if (S.loadNote && S.loaded && S.col) { b.hidden = false; b.textContent = S.loadNote; } else if (S.local && !S.items.length && S.loaded) { b.hidden = false; b.innerHTML = "<b>Mode local.</b> Ouvrez cette page connecté à claude.ai pour enregistrer vos fiches dans votre espace privé."; } else b.hidden = true;
  const v = $("view");
  if (S.tab === "ask") {
    const q = $("askQ"); const focused = q && document.activeElement === q; const pos = focused ? q.selectionStart : 0;
    renderAsk(v); if (focused) { const n = $("askQ"); n.focus(); n.setSelectionRange(pos, pos); }
  } else if (S.tab === "cycle") renderCycle(v); else if (S.tab === "sheets") renderSheets(v); else renderStudio(v);
  if (S.open) { const it = S.items.find((x) => x.id === S.open); if (!it) { S.open = null; renderDrawer(); } }
}

/* ---------- Wiring ---------- */
$("capAdd").onclick = addFromCapture;
$("capPick").onclick = () => $("capFile").click();
$("capFile").onchange = (e) => { acceptFiles(e.target.files); e.target.value = ""; };
$("capBulk").onclick = () => { if (!S.imp || !S.imp.busy) openImport([], ""); };
$("capGal").onclick = () => $("capGallery").click();
$("capCam").onclick = () => $("capCamera").click();
$("capGallery").onchange = (e) => { acceptFiles(e.target.files); e.target.value = ""; };
$("capCamera").onchange = (e) => { acceptFiles(e.target.files); e.target.value = ""; };
$("capConn").onclick = () => { if (S.imp && S.imp.busy) return; S.imp = null; renderImport(); S.conn = S.conn || { src: "drive", q: "", busy: false, err: "" }; S.conn.open = true; renderConn(); $("connPanel").scrollIntoView({ behavior: "smooth", block: "start" }); };
$("runQueue").onclick = () => { if (S.batch.running) { S.batch.stop = true; $("runQueue").textContent = "Arrêt après ce lot…"; } else analyzeQueue(); };
$("capText").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); addFromCapture(); } });
$("capText").addEventListener("paste", (e) => { const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith("image/")); if (f) { e.preventDefault(); setAttach(f); } });
const cap = $("capture");
cap.addEventListener("dragover", (e) => { e.preventDefault(); cap.classList.add("drag"); });
cap.addEventListener("dragleave", () => cap.classList.remove("drag"));
cap.addEventListener("drop", (e) => { e.preventDefault(); cap.classList.remove("drag"); const f = e.dataTransfer.files; if (f && f.length) acceptFiles(f); else { const t = e.dataTransfer.getData("text/plain"); if (t) $("capText").value += t; } });
$("tabSheets").onclick = () => { S.tab = "sheets"; render(); };
$("tabStudio").onclick = () => { S.tab = "studio"; render(); };
$("tabCycle").onclick = () => { S.tab = "cycle"; render(); };
$("tabAsk").onclick = () => { S.tab = "ask"; render(); const q = $("askQ"); if (q && !q.disabled) q.focus(); };
let qT; $("search").oninput = (e) => { clearTimeout(qT); qT = setTimeout(() => { S.filter.q = e.target.value; S.tab = "sheets"; render(); }, 150); };
$("reorg").onclick = proposeReorg;
$("exportAll").onclick = exportAll;
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.open) { S.open = null; renderDrawer(); } });

function goLocal(note) { S.local = true; S.col = null; ingest(localLoad()); S.loaded = true; S.loadNote = note || ""; render(); }

render();
(async () => {
  const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [db, user, sample, downloads, mcp] = await Promise.all([use("db"), use("user"), use("sample"), use("downloads"), use("mcp")]);
  S.sample = sample; S.downloads = downloads; S.mcp = mcp; if (S.conn && S.conn.open) renderConn();
  if (sample) { try { const lim = await sample.limits(); S.canImg = !!lim.images; S.canTools = !!lim.tools; } catch { S.canImg = false; S.canTools = false; } }
  let uid = null; if (user) { try { uid = await user.id(); } catch {} }
  if (!db || !uid) return goLocal();
  S.col = db.collection("data/users/" + uid);
  S.loadNote = "Chargement de vos fiches…"; render();
  const timer = setTimeout(() => { S.loadNote = "Vos fiches ne sont pas encore joignables. Elles s'afficheront dès que la connexion répond."; S.loaded = true; render(); }, 10000);
  S.col.orderBy("createdAt", "desc").limit(1000).onSnapshot((snap) => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); S.loadNote = ""; }
    ingest(snap.docs.map((d) => ({ ...d.data(), id: d.id }))); S.loaded = true; render(); if (S.open) renderDrawer();
  }, (e) => { clearTimeout(timer); goLocal("Votre espace n'est plus accessible (" + e.code + ") : passage en mode local."); });
})();
})();
</script>
